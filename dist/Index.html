<!DOCTYPE html>
<html lang="zh-Hant-TW" data-theme="light" data-font="std" data-size="m">
<head>
<base target="_top">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>分級讀本調級機器人</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=Noto+Serif+TC:wght@400;600&display=swap">
<style>
/* 版面概念：批改桌。左邊是原稿（稿紙橫線），右邊是批改結果；藍筆＝目標級以內，朱筆＝超綱。 */
:root {
  --paper: #F3F5F8;
  --surface: #FFFFFF;
  --ink: #17212B;
  --ink-2: #4A5663;
  --ink-3: #6F7B88;
  --rule: #D7DDE4;
  --grid: #E3E8EE;
  --accent: #1F5A8C;
  --accent-ink: #FFFFFF;
  --accent-soft: #E3EDF7;
  --within: #2F7FB8;
  --above: #D9572B;
  --above-ink: #A9401B;
  --above-soft: #FBE6DE;
  --warn: #8A5E00;
  --warn-soft: #F6EDD6;
  --ok: #276C44;
  --ok-soft: #E0F0E6;
  --bar-muted: #A3ADB8;
  --shadow: 0 1px 2px rgba(23, 33, 43, .06), 0 4px 16px rgba(23, 33, 43, .05);

  --f-display: "LXGW WenKai TC", "Kaiti TC", "BiauKai", "DFKai-SB", serif;
  --f-body: "Noto Sans TC", system-ui, "PingFang TC", "Microsoft JhengHei", sans-serif;
  --f-read: "Noto Serif TC", "Songti TC", "PMingLiU", serif;
  --read-font: var(--f-read);
  --read-size: 1.0625rem;
  --read-scale: 1;
  --read-lh: 2.1;

  --t-xs: .75rem; --t-sm: .8125rem; --t-md: .9375rem; --t-lg: 1.125rem; --t-xl: 1.5rem; --t-2xl: 2rem;
  --r: 10px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #10151B; --surface: #172029; --ink: #E2E8EE; --ink-2: #A9B4BF; --ink-3: #85919D;
    --rule: #2A3541; --grid: #222C37; --accent: #74AADB; --accent-ink: #0D1620; --accent-soft: #1B2B3C;
    --within: #3A8BD0; --above: #E2643A; --above-ink: #F2906C; --above-soft: #3A2219;
    --warn: #E2B65C; --warn-soft: #32290F; --ok: #6DC292; --ok-soft: #15301F; --bar-muted: #5A6672;
    --shadow: 0 1px 2px rgba(0, 0, 0, .3), 0 4px 16px rgba(0, 0, 0, .25);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #10151B; --surface: #172029; --ink: #E2E8EE; --ink-2: #A9B4BF; --ink-3: #85919D;
  --rule: #2A3541; --grid: #222C37; --accent: #74AADB; --accent-ink: #0D1620; --accent-soft: #1B2B3C;
  --within: #3A8BD0; --above: #E2643A; --above-ink: #F2906C; --above-soft: #3A2219;
  --warn: #E2B65C; --warn-soft: #32290F; --ok: #6DC292; --ok-soft: #15301F; --bar-muted: #5A6672;
  --shadow: 0 1px 2px rgba(0, 0, 0, .3), 0 4px 16px rgba(0, 0, 0, .25);
  color-scheme: dark;
}

* { box-sizing: border-box; }
[hidden] { display: none !important; }
/* 單欄格線一律 minmax(0,1fr)，避免寬表格把整欄撐開 */
.input-pane, .result-pane, #result, .tabpanel, .sec, .verdict, .field, .empty { grid-template-columns: minmax(0, 1fr); }
#result { display: grid; gap: 14px; }
html, body { margin: 0; }
body {
  background: var(--paper); color: var(--ink);
  font: 400 var(--t-md)/1.6 var(--f-body);
  -webkit-font-smoothing: antialiased;
}
button, input, select, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.num { font-variant-numeric: tabular-nums; }

.app {
  max-width: 1360px; margin: 0 auto;
  padding-block: 20px 28px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  display: grid; gap: 16px;
}

/* ---- 頁首 */
.top { display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 12px 24px; }
.brand h1 { margin: 0; font: 700 var(--t-2xl)/1.15 var(--f-display); letter-spacing: .04em; text-wrap: balance; }
.brand .sub { margin: 4px 0 0; color: var(--ink-2); font-size: var(--t-sm); }
.status { display: flex; flex-wrap: wrap; gap: 6px; }
.chip {
  display: inline-flex; align-items: center; gap: 6px;
  padding: 3px 10px; border-radius: 999px; font-size: var(--t-xs); line-height: 1.6;
  background: var(--surface); border: 1px solid var(--rule); color: var(--ink-2); white-space: nowrap;
}
.chip .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--ink-3); }
.chip.ok .dot { background: var(--ok); }
.chip.warn { background: var(--warn-soft); border-color: transparent; color: var(--warn); }
.chip.warn .dot { background: var(--warn); }

.preview-note {
  font-size: var(--t-sm); color: var(--warn); background: var(--warn-soft);
  border-radius: var(--r); padding: 8px 12px;
}

/* ---- 顯示設定 */
.sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0; }
.settings {
  display: flex; flex-wrap: wrap; align-items: center; gap: 8px 18px;
  background: var(--surface); border: 1px solid var(--rule); border-radius: 12px; padding: 10px 14px;
}
.set { display: inline-flex; align-items: center; gap: 8px; min-width: 0; }
.set-k { font-size: var(--t-xs); color: var(--ink-3); white-space: nowrap; }
.set select { width: auto; max-width: 15em; padding: 5px 8px; font-size: var(--t-sm); }
.seg { display: inline-flex; border: 1px solid var(--rule); border-radius: 8px; overflow: hidden; }
.seg button { border: 0; background: var(--surface); padding: 4px 12px; cursor: pointer; font-size: var(--t-sm); border-left: 1px solid var(--rule); }
.seg button:first-child { border-left: 0; }
.seg button[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); }
.set-note { margin: 0 0 0 auto; font-size: var(--t-xs); color: var(--ink-2); display: inline-flex; align-items: center; gap: 6px; max-width: 46ch; }
.tag-zh { flex: none; font: 700 var(--t-xs)/1.5 var(--f-body); color: var(--ok); background: var(--ok-soft); border-radius: 4px; padding: 0 6px; }
.font-note { flex-basis: 100%; margin: 0; font-size: var(--t-xs); color: var(--ink-2); }
.font-note.warn { color: var(--warn); }
.font-note a { color: var(--accent); }
@media (max-width: 640px) { .set-note { margin-left: 0; } }
:lang(my), :lang(km), :lang(lo), :lang(si), :lang(th) { line-height: 1.85; }

/* ---- 桌面兩欄 */
.desk { display: grid; grid-template-columns: minmax(0, 5fr) minmax(0, 7fr); gap: 16px; align-items: start; }
@media (max-width: 980px) { .desk { grid-template-columns: minmax(0, 1fr); } }
.pane { background: var(--surface); border: 1px solid var(--rule); border-radius: 14px; box-shadow: var(--shadow); padding: 18px; min-width: 0; }
.input-pane { display: grid; gap: 14px; position: sticky; top: env(safe-area-inset-top, 0px); }
@media (max-width: 980px) { .input-pane { position: static; } }
.pane-h { margin: 0; font: 700 var(--t-lg)/1.3 var(--f-display); letter-spacing: .06em; }

.field { display: grid; gap: 6px; min-width: 0; margin: 0; padding: 0; border: 0; }
.label { font-size: var(--t-sm); font-weight: 500; color: var(--ink-2); padding: 0; }
.label-row { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; flex-wrap: wrap; }
.hint, .fine { font-size: var(--t-xs); color: var(--ink-3); margin: 0; }
.row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
@media (max-width: 460px) { .row2 { grid-template-columns: 1fr; } }

select, textarea, input[type="text"] {
  width: 100%; border: 1px solid var(--rule); border-radius: 8px; background: var(--surface);
  padding: 8px 10px; min-width: 0;
}
select { appearance: auto; }

/* ---- 對標滑桿：TBCL 刻度與 TOCFL、CEFR 同軸對齊（刻度位置 = 11px + (n-1)/6 × (100% − 22px)，與滑桿圓鈕中心一致） */
.readout { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 10px; }
.ro-level { font: 700 var(--t-2xl)/1.1 var(--f-display); letter-spacing: .04em; color: var(--accent); font-variant-numeric: tabular-nums; }
.ro-band { font-size: var(--t-xs); font-weight: 700; color: var(--accent); background: var(--accent-soft); padding: 1px 8px; border-radius: 999px; letter-spacing: .1em; }
.ro-map { font-size: var(--t-sm); color: var(--ink-2); }
.ruler { display: grid; grid-template-columns: 3.4em minmax(0, 1fr); column-gap: 18px; row-gap: 2px; align-items: center; }
.rk { font-size: var(--t-xs); color: var(--ink-3); letter-spacing: .06em; text-align: right; }
.rv { position: relative; min-width: 0; }
.ticks { position: relative; height: 1.5em; }
.tk {
  position: absolute; top: 0; transform: translateX(-50%); white-space: nowrap; cursor: pointer;
  font-size: var(--t-xs); line-height: 1.5; color: var(--ink-3); font-variant-numeric: tabular-nums;
  padding: 0 2px; border-radius: 4px;
}
.tk:hover { color: var(--ink); }
.tk.on { color: var(--accent); font-weight: 700; }
#tk-tbcl .tk { font-size: var(--t-sm); }
.bands { height: 1.5em; }
.bd {
  position: absolute; top: .55em; height: .5em; border: 1px solid var(--rule); border-top: 0; border-radius: 0 0 4px 4px;
  font-size: 0; margin: 0 3px;
}
.bd::after {
  content: attr(data-label); position: absolute; left: 50%; top: .15em; transform: translateX(-50%);
  font-size: var(--t-xs); line-height: 1; color: var(--ink-3); background: var(--surface); padding: 0 5px; letter-spacing: .1em; white-space: nowrap;
}
.bd.on { border-color: var(--accent); }
.bd.on::after { color: var(--accent); font-weight: 700; }

#level {
  --fill: 50%;
  -webkit-appearance: none; appearance: none; display: block;
  width: 100%; height: 30px; margin: 0; padding: 0; background: transparent; cursor: pointer;
}
#level::-webkit-slider-runnable-track {
  height: 6px; border-radius: 999px;
  background: linear-gradient(to right, var(--accent) 0, var(--accent) var(--fill), var(--rule) var(--fill), var(--rule) 100%);
}
#level::-webkit-slider-thumb {
  -webkit-appearance: none; appearance: none; box-sizing: border-box;
  width: 22px; height: 22px; margin-top: -8px; border-radius: 50%;
  background: var(--surface); border: 4px solid var(--accent); box-shadow: var(--shadow);
}
#level::-moz-range-track { height: 6px; border-radius: 999px; background: var(--rule); }
#level::-moz-range-progress { height: 6px; border-radius: 999px; background: var(--accent); }
#level::-moz-range-thumb {
  box-sizing: border-box; width: 22px; height: 22px; border-radius: 50%;
  background: var(--surface); border: 4px solid var(--accent); box-shadow: var(--shadow);
}
#level:focus-visible { outline: none; }
#level:focus-visible::-webkit-slider-thumb { outline: 2px solid var(--accent); outline-offset: 3px; }
#level:focus-visible::-moz-range-thumb { outline: 2px solid var(--accent); outline-offset: 3px; }
.lvl-meta { font-size: var(--t-xs); color: var(--ink-3); margin: 0; }

.purpose { display: flex; flex-wrap: wrap; gap: 6px 14px; }
.purpose legend { margin-bottom: 4px; }
.radio, .check { display: inline-flex; align-items: center; gap: 6px; font-size: var(--t-sm); cursor: pointer; }
.radio input, .check input { accent-color: var(--accent); margin: 0; }

/* 稿紙橫線 */
textarea.paper, .reading {
  font-family: var(--read-font); font-weight: 400;
  font-size: calc(var(--read-size) * var(--read-scale)); line-height: var(--read-lh);
  background-color: var(--surface);
  background-image: repeating-linear-gradient(to bottom, transparent 0, transparent calc(var(--read-lh) * 1em - 1px), var(--grid) calc(var(--read-lh) * 1em - 1px), var(--grid) calc(var(--read-lh) * 1em));
  background-attachment: local;
}
textarea.paper { min-height: 300px; resize: vertical; padding: 0 12px; }
textarea.paper::placeholder { font-family: var(--f-body); font-size: var(--t-sm); line-height: calc(var(--read-lh) * var(--read-size) * var(--read-scale)); }

/* 字級與 ToneOZ 標音字型：標音在字的上方（拼音）或右側（注音），行距與字級要放大 */
:root[data-size="s"] { --read-size: .9375rem; }
:root[data-size="m"] { --read-size: 1.0625rem; }
:root[data-size="l"] { --read-size: 1.375rem; }
:root[data-font="pinyin"] { --read-font: "GR ToneOZ Pinyin", var(--f-read); --read-scale: 1.3; --read-lh: 2.5; }
:root[data-font="zhuyin"] { --read-font: "GR ToneOZ Zhuyin", var(--f-read); --read-scale: 1.2; --read-lh: 2.1; }
:root[data-font="pinyin"] td.w, :root[data-font="zhuyin"] td.w { line-height: 2.3; font-size: 1.125rem; }
.count { font-size: var(--t-xs); color: var(--ink-3); }
.count.over { color: var(--above-ink); font-weight: 500; }
.text-actions { display: flex; gap: 14px; }

details.more { border-top: 1px solid var(--rule); padding-top: 10px; }
details.more summary { cursor: pointer; font-size: var(--t-sm); color: var(--ink-2); }
details.more[open] { display: grid; gap: 10px; }
details.more textarea { font-size: var(--t-sm); }

.actions { display: flex; flex-wrap: wrap; gap: 8px; }
.btn {
  border-radius: 9px; padding: 9px 16px; cursor: pointer; font-weight: 500; border: 1px solid transparent;
  transition: filter .12s, background .12s;
}
.btn.primary { background: var(--accent); color: var(--accent-ink); flex: 1 1 160px; }
.btn.primary:hover { filter: brightness(1.08); }
.btn.secondary { background: var(--surface); border-color: var(--rule); color: var(--ink); }
.btn.secondary:hover { border-color: var(--accent); }
.btn:disabled { opacity: .5; cursor: not-allowed; filter: none; }
.btn.small { padding: 5px 11px; font-size: var(--t-sm); }
.link { background: none; border: 0; padding: 0; color: var(--accent); cursor: pointer; font-size: var(--t-sm); }
.link:hover { text-decoration: underline; }

/* ---- 結果 */
.result-pane { position: relative; display: grid; gap: 14px; min-height: 420px; align-content: start; }
.empty { display: grid; gap: 10px; color: var(--ink-2); font-size: var(--t-sm); max-width: 60ch; }
.empty ol { margin: 0; padding-left: 1.3em; display: grid; gap: 4px; }

.verdict { display: grid; gap: 10px; }
.verdict-line { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; }
.pill {
  display: inline-flex; align-items: center; gap: 6px; font-weight: 700; font-size: var(--t-sm);
  padding: 3px 12px; border-radius: 999px;
}
.pill::before { content: ""; width: 8px; height: 8px; border-radius: 2px; background: currentColor; }
.pill.hard { color: var(--above-ink); background: var(--above-soft); }
.pill.easy { color: var(--warn); background: var(--warn-soft); }
.pill.ok { color: var(--ok); background: var(--ok-soft); }
.pill.na { color: var(--ink-2); background: var(--grid); }
.verdict-text { font-size: var(--t-md); }
.verdict-text b { font-family: var(--f-display); font-size: var(--t-lg); }
.statement { margin: 0; font-size: var(--t-sm); color: var(--ink-2); border-left: 3px solid var(--rule); padding-left: 10px; }

.kpis { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px; }
@media (max-width: 640px) { .kpis { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
.kpi { background: var(--paper); border-radius: var(--r); padding: 10px 12px; display: grid; gap: 2px; min-width: 0; }
.kpi .k { font-size: var(--t-xs); color: var(--ink-3); }
.kpi .v { font: 700 var(--t-xl)/1.2 var(--f-body); font-variant-numeric: tabular-nums; }
.kpi .v small { font-size: var(--t-sm); font-weight: 500; color: var(--ink-2); }
.kpi .d { font-size: var(--t-xs); color: var(--ink-2); }
.kpi.bad .v { color: var(--above-ink); }
.kpi.good .v { color: var(--ok); }

.tabs { display: flex; gap: 2px; border-bottom: 1px solid var(--rule); overflow-x: auto; scrollbar-width: thin; }
.tab {
  background: none; border: 0; border-bottom: 2px solid transparent; padding: 8px 12px; cursor: pointer;
  font-size: var(--t-sm); color: var(--ink-2); white-space: nowrap; margin-bottom: -1px;
}
.tab[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--accent); font-weight: 700; }
.tab:disabled { color: var(--ink-3); opacity: .6; cursor: not-allowed; }
.tab .n { font-variant-numeric: tabular-nums; color: var(--ink-3); font-weight: 400; margin-left: 4px; }
.tabpanel { display: grid; gap: 16px; min-width: 0; }

.sec { display: grid; gap: 8px; min-width: 0; }
.sec-h { margin: 0; font: 700 var(--t-md)/1.4 var(--f-display); letter-spacing: .05em; display: flex; justify-content: space-between; align-items: baseline; gap: 8px; flex-wrap: wrap; }
.sec-h .aside { font: 400 var(--t-xs)/1.4 var(--f-body); color: var(--ink-3); letter-spacing: 0; }
.charts { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 16px; }
@media (max-width: 720px) { .charts { grid-template-columns: minmax(0, 1fr); } }

/* 覆蓋率曲線 */
.curve { position: relative; }
.curve svg { display: block; width: 100%; height: auto; overflow: visible; }
.curve .axis text, .dist .lbl { fill: var(--ink-3); font-size: 11px; font-family: var(--f-body); }
.curve .gridline { stroke: var(--grid); stroke-width: 1; }
.curve .thr { stroke: var(--above); stroke-width: 1.5; stroke-dasharray: 4 3; }
.curve .thr-lbl { fill: var(--above-ink); font-size: 11px; }
.curve .tgt { stroke: var(--ink-3); stroke-width: 1; stroke-dasharray: 2 3; }
.curve .tgt-lbl { fill: var(--ink-2); font-size: 11px; }
.curve .line { fill: none; stroke: var(--within); stroke-width: 2; stroke-linejoin: round; }
.curve .area { fill: var(--within); opacity: .1; }
.curve .pt { fill: var(--surface); stroke: var(--within); stroke-width: 2; }
.curve .pt.est { fill: var(--within); }
.curve .hit { fill: transparent; cursor: crosshair; }
.curve .xh { stroke: var(--ink-3); stroke-width: 1; }
.tip {
  position: absolute; pointer-events: none; background: var(--ink); color: var(--surface);
  font-size: var(--t-xs); padding: 6px 9px; border-radius: 6px; white-space: nowrap; z-index: 3;
  transform: translate(-50%, calc(-100% - 10px));
}

/* 等級分布 */
.dist { display: grid; gap: 5px; position: relative; }
.drow { display: grid; grid-template-columns: 4.6em minmax(0, 1fr) 5.4em; align-items: center; gap: 8px; font-size: var(--t-xs); }
.drow .name { color: var(--ink-2); white-space: nowrap; }
.drow .name .tag { color: var(--above-ink); font-weight: 700; margin-left: 2px; }
.drow .track { height: 14px; background: var(--paper); border-radius: 4px; overflow: hidden; }
.drow .bar { height: 100%; border-radius: 0 4px 4px 0; background: var(--within); min-width: 2px; }
.drow .bar.above {
  background-color: var(--above);
  background-image: repeating-linear-gradient(135deg, transparent 0 4px, rgba(255, 255, 255, .35) 4px 6px);
}
.drow .bar.muted { background: var(--bar-muted); }
.drow .bar.zero { min-width: 0; }
.drow .val { text-align: right; font-variant-numeric: tabular-nums; color: var(--ink-2); white-space: nowrap; }
.drow:hover .name, .drow:hover .val { color: var(--ink); }
.drow.sep { margin-top: 4px; padding-top: 6px; border-top: 1px dashed var(--rule); }

/* 標記文本 */
.reading {
  margin: 0; padding: 0 14px; border: 1px solid var(--rule); border-radius: var(--r);
  white-space: pre-wrap; word-break: break-word; overflow-wrap: anywhere;
}
.reading .ab { color: var(--above-ink); text-decoration: underline wavy var(--above); text-decoration-thickness: 1.5px; text-underline-offset: 5px; text-decoration-skip-ink: none; }
.reading .gl { text-decoration: underline dashed var(--ink-3); text-underline-offset: 5px; }
.reading .ab sup, .reading .gl sup { font: 700 .6em/1 var(--f-body); margin-left: 1px; color: var(--above-ink); }
.reading .gl sup { color: var(--ink-3); }
.reading .tl { text-decoration: underline solid var(--within); text-decoration-thickness: 2px; text-underline-offset: 5px; }
.reading .oov { background: var(--warn-soft); border-radius: 3px; }
.reading .pn { text-decoration: underline dotted var(--ink-3); text-underline-offset: 5px; }
.reading .sp { color: var(--ink-3); }
.reading .simp { outline: 1.5px solid var(--above); outline-offset: 1px; border-radius: 2px; }
.legend { display: flex; flex-wrap: wrap; gap: 4px 14px; font-size: var(--t-xs); color: var(--ink-2); align-items: center; }
.legend .sw { display: inline-block; margin-right: 4px; font-family: var(--f-read); font-size: var(--t-sm); }
.legend .sw.ab { color: var(--above-ink); text-decoration: underline wavy var(--above); text-underline-offset: 3px; }
.legend .sw.gl { text-decoration: underline dashed var(--ink-3); text-underline-offset: 3px; }
.legend .sw.tl { text-decoration: underline solid var(--within); text-decoration-thickness: 2px; text-underline-offset: 3px; }
.legend .sw.oov { background: var(--warn-soft); padding: 0 2px; border-radius: 3px; }
.legend .sw.pn { text-decoration: underline dotted var(--ink-3); text-underline-offset: 3px; }
.legend label { margin-left: auto; }

/* 表格 */
.tablewrap { overflow-x: auto; border: 1px solid var(--rule); border-radius: var(--r); }
table { width: 100%; border-collapse: collapse; font-size: var(--t-sm); }
th, td { text-align: left; padding: 7px 10px; border-bottom: 1px solid var(--rule); vertical-align: top; }
th { font-weight: 500; color: var(--ink-3); font-size: var(--t-xs); background: var(--paper); white-space: nowrap; }
tr:last-child td { border-bottom: 0; }
td.w { font-family: var(--read-font); font-size: var(--t-md); white-space: nowrap; }
td.ctx { color: var(--ink-2); font-family: var(--f-read); min-width: 14em; }
td.n, th.n { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
td.orig { color: var(--ink-2); text-decoration: line-through var(--above); text-decoration-thickness: 1px; font-family: var(--f-read); }
td.rev { font-family: var(--f-read); }
.lv { display: inline-block; min-width: 1.6em; text-align: center; font: 700 var(--t-xs)/1.6 var(--f-body); border-radius: 4px; padding: 0 4px; }
.lv.above { color: var(--above-ink); background: var(--above-soft); }
.lv.in { color: var(--accent); background: var(--accent-soft); }
.lv.none { color: var(--warn); background: var(--warn-soft); }
.cat { display: inline-block; font-size: var(--t-xs); padding: 0 7px; border-radius: 4px; background: var(--grid); color: var(--ink-2); white-space: nowrap; }
.flag { color: var(--warn); font-size: var(--t-xs); }

.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chips span { font-family: var(--f-read); font-size: var(--t-sm); padding: 1px 8px; border-radius: 6px; background: var(--warn-soft); color: var(--ink); }
.chips span em { font-style: normal; color: var(--ink-3); font-family: var(--f-body); font-size: var(--t-xs); margin-left: 2px; }

.notes { display: grid; gap: 6px; margin: 0; padding: 0; list-style: none; }
.notes li { font-size: var(--t-sm); padding: 8px 12px; border-radius: 8px; background: var(--paper); }
.notes li.warn { background: var(--warn-soft); color: var(--warn); }
.notes li.bad { background: var(--above-soft); color: var(--above-ink); }

.compare { display: grid; grid-template-columns: minmax(0, 1fr); }
.compare td.arrow { color: var(--ink-3); width: 1.5em; text-align: center; }
.better { color: var(--ok); font-weight: 700; }
.worse { color: var(--above-ink); font-weight: 700; }

.toolbar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.toolbar .spacer { flex: 1; }
.toolbar .btn { flex: 0 0 auto; }
.copied { font-size: var(--t-xs); color: var(--ok); }

/* 報告 */
.md { font-size: var(--t-sm); line-height: 1.75; max-width: 75ch; }
.md h1 { font: 700 var(--t-xl)/1.3 var(--f-display); margin: 0 0 8px; }
.md h2 { font: 700 var(--t-lg)/1.4 var(--f-display); margin: 18px 0 6px; }
.md p, .md ul { margin: 6px 0; }
.md blockquote { margin: 8px 0; padding: 6px 12px; border-left: 3px solid var(--accent); background: var(--accent-soft); border-radius: 0 6px 6px 0; }
.md .tablewrap { margin: 8px 0; }

/* 忙碌狀態 */
.busy { position: absolute; inset: 0; background: color-mix(in srgb, var(--surface) 82%, transparent); display: grid; place-items: center; border-radius: 14px; z-index: 5; }
.busy-card { text-align: center; display: grid; gap: 6px; justify-items: center; padding: 20px; max-width: 34ch; }
.busy-card p { margin: 0; }
.spinner { width: 28px; height: 28px; border-radius: 50%; border: 3px solid var(--grid); border-top-color: var(--accent); animation: spin .9s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
@media (prefers-reduced-motion: reduce) { .spinner { animation-duration: 3s; } * { transition: none !important; } }

.error { padding: 10px 14px; border-radius: var(--r); background: var(--above-soft); color: var(--above-ink); font-size: var(--t-sm); }

.foot { font-size: var(--t-xs); color: var(--ink-3); display: flex; flex-wrap: wrap; gap: 4px 16px; justify-content: space-between; }
.foot a { color: var(--ink-2); }

/* ==== 簡潔模板 v1.3：單欄、等級滑桿卡片、對話式輸入框 ==== */
:root {
  --page: #F3F4F6; --card: #FFFFFF; --line: #E5E7EB;
  --slider: #EA7A2E; --slider-soft: #FDEBDD; --slider-ink: #B4561A;
  --send: #3B82F6; --send-ink: #FFFFFF;

}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --page: #111418; --card: #1A1F25; --line: #2B323B;
    --slider: #F08A45; --slider-soft: #3A2516; --slider-ink: #F6A86F;
    --send: #4D8FF6; --send-ink: #0B1220;
    --band-n: #4CC07C; --band-a: #6C9BF0; --band-b: #F08A45; --band-c: #EF6A6A;

}
:root[data-theme="dark"] {
  --page: #111418; --card: #1A1F25; --line: #2B323B;
  --slider: #F08A45; --slider-soft: #3A2516; --slider-ink: #F6A86F;
  --send: #4D8FF6; --send-ink: #0B1220;
  --band-n: #4CC07C; --band-a: #6C9BF0; --band-b: #F08A45; --band-c: #EF6A6A;

}
body { background: var(--page); }
.app { max-width: 820px; gap: 14px; padding-block: 18px 28px; }

.bar { display: flex; align-items: center; gap: 10px 14px; flex-wrap: wrap; }
.bar .title { margin: 0; font: 700 1.125rem/1.3 var(--f-body); letter-spacing: .02em; margin-right: auto; }
.bar .status { display: flex; gap: 6px; flex-wrap: wrap; }
.gear { position: relative; }
.gear > summary {

  padding: 5px 10px; border-radius: 999px; border: 1px solid var(--line); background: var(--card);

}
.gear > summary::-webkit-details-marker { display: none; }
.gear[open] > summary { border-color: var(--slider); color: var(--ink); }
.gear-panel {

}
.gear-panel .set { justify-content: space-between; }
.gear-panel .set select { max-width: 13em; }

.card { background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 18px 20px; box-shadow: none; }

.eyebrow { font-size: var(--t-xs); font-weight: 700; letter-spacing: .14em; text-transform: uppercase; color: var(--ink-3); }
.badge { font-size: var(--t-sm); font-weight: 700; padding: 3px 12px; border-radius: 999px; background: var(--slider-soft); color: var(--slider-ink); white-space: nowrap; }
.badge.band-n { color: var(--band-n); background: color-mix(in srgb, var(--band-n) 14%, transparent); }
.badge.band-a { color: var(--band-a); background: color-mix(in srgb, var(--band-a) 14%, transparent); }
.badge.band-c { color: var(--band-c); background: color-mix(in srgb, var(--band-c) 14%, transparent); }

.level-card .ruler { display: grid; grid-template-columns: minmax(0, 1fr); gap: 0; margin-top: 6px; }
.level-card .ticks { position: relative; height: 1.6em; }
.level-card .tk { position: absolute; top: 0; transform: translateX(-50%); white-space: nowrap; cursor: pointer; font-size: var(--t-xs); line-height: 1.6; padding: 0 2px; border-radius: 4px; }
.level-card .tk.code { font-weight: 500; }
.level-card .tk.code[data-stop="0"] { transform: translateX(-11px); }
.level-card .tk.code[data-stop="7"] { transform: translateX(calc(-100% + 11px)); }
.level-card .tk.code.band-n { color: var(--band-n); }
.level-card .tk.code.band-a { color: var(--band-a); }
.level-card .tk.code.band-b { color: var(--band-b); }
.level-card .tk.code.band-c { color: var(--band-c); }
.level-card .tk.num { color: var(--ink-3); font-variant-numeric: tabular-nums; }
.level-card .tk.on { font-weight: 700; text-decoration: underline; text-underline-offset: 3px; }
.level-card .tk.num.on { color: var(--ink); text-decoration: none; }
@media (max-width: 520px) {
  .level-card .tk.code { font-size: .6875rem; }
  .level-card .tk.code[data-stop="0"], .level-card .tk.code[data-stop="1"] { font-size: 0; }
  .level-card .tk.code[data-stop="0"]::after { content: "N1"; font-size: .6875rem; }
  .level-card .tk.code[data-stop="1"]::after { content: "N2"; font-size: .6875rem; }
}
#level::-webkit-slider-runnable-track {
  background: linear-gradient(to right, var(--slider) 0, var(--slider) var(--fill), var(--line) var(--fill), var(--line) 100%);
}
#level::-webkit-slider-thumb { border-color: var(--slider); background: var(--card); }
#level::-moz-range-progress { background: var(--slider); }
#level::-moz-range-track { background: var(--line); }
#level::-moz-range-thumb { border-color: var(--slider); background: var(--card); }
#level:focus-visible::-webkit-slider-thumb { outline-color: var(--slider); }
.level-card .lvl-meta { margin: 2px 0 0; }

.composer { display: grid; gap: 8px; }
.compose-box { position: relative; background: var(--compose); border-radius: 16px; padding: 12px 64px 12px 16px; border: 1px solid var(--line); }
.compose-box:focus-within { border-color: var(--send); }
.compose-box textarea {
  display: block; width: 100%; min-height: 9em; resize: vertical; border: 0; padding: 0; background: transparent;
  font-family: var(--read-font); font-size: calc(var(--read-size) * var(--read-scale)); line-height: calc(var(--read-lh) * .85);
  color: var(--ink); outline: none;
}
.compose-box textarea::placeholder { font-family: var(--f-body); font-size: var(--t-sm); line-height: 1.7; color: var(--ink-3); }
.send {
  position: absolute; right: 12px; bottom: 12px; width: 42px; height: 42px; border-radius: 50%; border: 0; cursor: pointer;
  display: grid; place-items: center; background: var(--send); color: var(--send-ink);
  transition: filter .12s, transform .12s;
}
.send:hover { filter: brightness(1.08); }
.send:active { transform: scale(.95); }
.send:disabled { opacity: .45; cursor: not-allowed; }
.send:focus-visible { outline: 2px solid var(--send); outline-offset: 3px; }
.compose-foot { display: flex; flex-wrap: wrap; gap: 6px 16px; align-items: center; padding: 0 4px; }
.compose-foot .count { margin-left: auto; }
.compose-foot .link:disabled { color: var(--ink-3); cursor: not-allowed; }
.composer > .fine { margin: 0; padding: 0 4px; }
.composer .more { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 10px 14px; }
.composer .more[open] { display: grid; gap: 10px; }
.composer .more summary { font-size: var(--t-sm); }

.result-pane { min-height: 0; }
.result-pane .busy { border-radius: 16px; }
.foot { padding: 0 4px; }
</style>

<body>
<div class="app">

  <header class="bar">
    <h1 class="title" data-i18n="app.title">分級讀本調級機器人</h1>
    <div class="status" id="status" aria-live="polite"></div>
    <details class="gear" id="gear">
      <summary data-i18n-aria="set.title">
        <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path fill="currentColor" d="M19.4 13a7.6 7.6 0 0 0 0-2l2.1-1.6-2-3.5-2.5 1a7.4 7.4 0 0 0-1.7-1L15 3h-4l-.4 2.9a7.4 7.4 0 0 0-1.7 1l-2.5-1-2 3.5L6.5 11a7.6 7.6 0 0 0 0 2l-2.1 1.6 2 3.5 2.5-1a7.4 7.4 0 0 0 1.7 1L11 21h4l.4-2.9a7.4 7.4 0 0 0 1.7-1l2.5 1 2-3.5zM13 15.5A3.5 3.5 0 1 1 13 8.5a3.5 3.5 0 0 1 0 7z"/></svg>

      </summary>
      <div class="gear-panel">

        <label class="set" for="read-font">
          <span class="set-k" data-i18n="set.font">閱讀字體</span>
          <select id="read-font">
            <option value="std" data-i18n="font.std">標準明體</option>
            <option value="pinyin" data-i18n="font.pinyin">ToneOZ 繁體＋漢語拼音</option>

            <button type="button" data-size="l" aria-pressed="false"><span data-i18n="size.l">大</span></button>
          </div>
        </div>
        <p class="set-note" id="out-note"><span class="tag-zh">中文</span><span data-i18n="out.note">介面語言只改變按鈕與說明；分析結果、修訂稿與報告一律以臺灣正體中文輸出。</span></p>
      </div>
    </details>
  </header>

  <p class="font-note" id="font-note" aria-live="polite" hidden></p>
  <div class="preview-note" id="preview-note" hidden></div>

  <section class="card level-card" aria-labelledby="lvl-eyebrow">
    <div class="lc-head">
      <label class="eyebrow" id="lvl-eyebrow" for="level" data-i18n="level.choose">選擇目標等級</label>

      <div class="ticks codes" id="tk-code"></div>

  <section class="composer" aria-label="text">

        <p id="busy-text"></p>
        <p class="fine num" id="busy-time"></p>

  </section>

  <footer class="foot">

            fonts: { pinyinUrl: '', zhuyinUrl: '' }, fontToken: 0, currentTab: 't-report' };

  var SAMPLE = [
    '第一章：夜市',
    '安娜是從法國來的學生。今天晚上，她和朋友小美一起去士林夜市。',
    '夜市裡人很多，非常擁擠。攤販賣的東西琳瑯滿目，空氣中都是食物的香味。',
    '安娜迫不及待地想品嚐臺灣美食。她們排隊買了臭豆腐和珍珠奶茶。',
    '小美說：「這家的臭豆腐很有名，你一定要吃吃看！」',
    '吃完以後，她們坐出租車回宿舍。安娜觉得今天很开心。'
  ].join('\n');
  var SAMPLE_PROTECTED = '安娜、小美、士林夜市、法國';

  // --------------------------------------------------------------------------- 介面語言

  var I18N = window.GR_I18N || { langs: [{ code: 'zh-Hant', name: '繁體中文', bcp: 'zh-Hant-TW' }], strings: { 'zh-Hant': {} } };
  var OVR = {};             // 試算表「介面翻譯」的覆蓋值
  var LANG = 'zh-Hant';

  function lookup(lang, k) {
    if (OVR[lang] && OVR[lang][k]) return OVR[lang][k];
    var s = I18N.strings[lang];
    return s && s[k];
  }
  /** t('level.n', { n: 3 }) → 「第 3 級」；缺翻譯時依序退回英文、繁體中文。 */
  function t(k, p) {
    var s = lookup(LANG, k) || lookup('en', k) || lookup('zh-Hant', k) || k;
    return p ? String(s).replace(/\{(\w+)\}/g, function (m, n) { return p[n] !== undefined && p[n] !== null ? p[n] : m; }) : s;
  }
  function langMeta(code) { for (var i = 0; i < I18N.langs.length; i++) if (I18N.langs[i].code === code) return I18N.langs[i]; return null; }

  function pickLang(def) {
    var cands = [];
    if (window.GR_URL_PREFS && GR_URL_PREFS.lang) cands.push(GR_URL_PREFS.lang);
    cands.push(store('gr-lang'));
    if (def) cands.push(def);
    (navigator.languages || [navigator.language || '']).forEach(function (l) { cands.push(l); });
    var alias = { zh: 'zh-Hant', 'zh-TW': 'zh-Hant', 'zh-HK': 'zh-Hant', 'zh-MO': 'zh-Hant', 'zh-CN': 'zh-Hant', 'zh-SG': 'zh-Hant', tl: 'fil', 'in': 'id' };
    for (var i = 0; i < cands.length; i++) {
      var c = cands[i];
      if (!c) continue;
      if (langMeta(c)) return c;
      if (alias[c]) return alias[c];
      var base = String(c).split('-')[0];
      if (alias[base]) return alias[base];
      if (langMeta(base)) return base;
    }
    return 'zh-Hant';
  }

  function loadLangFont(meta) {
    if (!meta || !meta.font || document.getElementById('lf-' + meta.code)) return;
    var l = document.createElement('link');
    l.rel = 'stylesheet'; l.id = 'lf-' + meta.code;
    l.href = 'https://fonts.googleapis.com/css2?family=' + meta.font.replace(/ /g, '+') + ':wght@400;500;700&display=swap';
    document.head.appendChild(l);
  }

  function applyStatic() {
    document.querySelectorAll('[data-i18n]').forEach(function (el) { el.textContent = t(el.dataset.i18n); });
    document.querySelectorAll('[data-i18n-ph]').forEach(function (el) { el.placeholder = t(el.dataset.i18nPh); });
    document.querySelectorAll('[data-i18n-aria]').forEach(function (el) { el.setAttribute('aria-label', t(el.dataset.i18nAria)); });
  }

  function setLang(code, rerender) {
    LANG = langMeta(code) ? code : 'zh-Hant';
    var meta = langMeta(LANG);
    root.lang = meta.bcp || LANG;
    loadLangFont(meta);
    root.style.setProperty('--f-body', (meta.font ? '"' + meta.font + '", ' : '') + '"Noto Sans TC", system-ui, "PingFang TC", "Microsoft JhengHei", sans-serif');
    $('ui-lang').value = LANG;
    applyStatic();
    if (!rerender) return;
    renderLevels(); setTarget(S.target, true); renderPurpose(); renderLearners();
    if (S.status) renderStatus(S.status);
    updateCount();
    if (S.font !== 'std') setFont(S.font, true);
    if (S.last) renderResult(true);
  }

  // --------------------------------------------------------------------------- 閱讀字體（ToneOZ）

  var FONT_DEF = {
    pinyin: { family: 'GR ToneOZ Pinyin', local: 'ToneOZ-Pinyin-Kai-Traditional', urlKey: 'pinyinUrl', nameKey: 'font.pinyin' },
    zhuyin: { family: 'GR ToneOZ Zhuyin', local: 'ToneOZ-Zhuyin-Kai-Traditional', urlKey: 'zhuyinUrl', nameKey: 'font.zhuyin' }
  };
  function fontFormat(u) {
    var m = /\.(woff2|woff|otf|ttf)(\?|#|$)/i.exec(u || '');
    return { woff2: 'woff2', woff: 'woff', otf: 'opentype', ttf: 'truetype' }[m ? m[1].toLowerCase() : 'ttf'];
  }
  function ensureFace(d) {
    if (document.getElementById('face-' + d.local)) return;
    var url = S.fonts[d.urlKey];
    var src = 'local("' + d.local + '")' + (url ? ', url("' + url + '") format("' + fontFormat(url) + '")' : '');
    var st = document.createElement('style');
    st.id = 'face-' + d.local;
    st.textContent = '@font-face{font-family:"' + d.family + '";src:' + src + ';font-display:swap;}';
    document.head.appendChild(st);
  }

  function setFont(key, quiet) {
    if (!FONT_DEF[key]) key = 'std';
    S.font = key;
    root.dataset.font = key;
    $('read-font').value = key;
    store('gr-font', key);
    var note = $('font-note');
    if (key === 'std') { note.hidden = true; refreshReading(); return; }
    var d = FONT_DEF[key], token = ++S.fontToken;
    ensureFace(d);
    var missing = function () {
      if (token !== S.fontToken) return;
      note.className = 'font-note warn';
      note.innerHTML = esc(t('font.missing', { name: t(d.nameKey) }))
        + ' <a href="https://toneoz.com/blog/download-fonts/" target="_blank" rel="noopener">' + esc(t('font.download')) + '</a>';
    };
    note.hidden = false; note.className = 'font-note';
    if (!quiet) note.textContent = t('font.loading');
    var probe = document.fonts && document.fonts.load ? document.fonts.load('32px "' + d.family + '"', '中了') : Promise.resolve([]);
    probe.then(function (list) {
      if (token !== S.fontToken) return;
      if (list && list.length) { note.className = 'font-note'; note.textContent = t('font.ready', { name: t(d.nameKey) }); refreshReading(); }
      else missing();
    }, missing);
    refreshReading();
  }

  function setSize(sz) {
    S.size = ['s', 'm', 'l'].indexOf(sz) >= 0 ? sz : 'm';
    root.dataset.size = S.size;
    document.querySelectorAll('#read-size button').forEach(function (b) { b.setAttribute('aria-pressed', b.dataset.size === S.size); });
    store('gr-size', S.size);
  }

  /** 換字體後重畫標記文本（ToneOZ 字型要用含多音字選擇器的版本）。 */
  function refreshReading() {
    if (!S.last) return;
    renderReport();
    if (S.last.action === 'adjust') renderRevised(S.last);
  }

  // --------------------------------------------------------------------------- 後端呼叫

  function call(name, req) {
    return new Promise(function (resolve, reject) {
      if (window.google && google.script && google.script.run) {
        google.script.run
          .withSuccessHandler(resolve)
          .withFailureHandler(function (e) { reject(e instanceof Error ? e : new Error(String(e && e.message || e))); })[name](req);
      } else if (window.GR_PREVIEW) {
        setTimeout(function () {
          try { resolve(window.GR_PREVIEW[name](req)); } catch (e) { reject(e); }
        }, name === 'uiAdjust' ? 1200 : 150);
      } else {
        reject(new Error(t('err.backend')));
      }
    });
  }

  // --------------------------------------------------------------------------- 工具

  function esc(s) {
    return String(s === null || s === undefined ? '' : s)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  }
  function fmt(n) { return (n === null || n === undefined || n === '') ? '—' : Number(n).toLocaleString('en-US'); }
  function hanCount(s) { var m = String(s || '').match(/\p{Script=Han}/gu); return m ? m.length : 0; }
  function level(n) { for (var i = 0; i < S.levels.length; i++) if (S.levels[i].level === n) return S.levels[i]; return null; }
  function modelName(id) {
    if (!id) return '';
    var p = String(id).split('-');
    if (p[0] !== 'claude' || p.length < 3) return id;
    return 'Claude ' + p[1].charAt(0).toUpperCase() + p[1].slice(1) + ' ' + p.slice(2).join('.');
  }
  function store(k, v) { try { if (v === undefined) return localStorage.getItem(k); localStorage.setItem(k, v); } catch (e) { return null; } }
  var BAND_KEY = { '基礎': 'band.basic', '進階': 'band.adv', '精熟': 'band.prof' };
  function bandName(b) { return BAND_KEY[b] ? t(BAND_KEY[b]) : b; }
  function tocflName(L) { return LANG === 'zh-Hant' ? L.tocfl + '（' + L.tocflEn + '）' : L.tocflEn + ' (' + L.tocfl + ')'; }
  function estText(an) {
    if (!an || !an.meta.lexiconLoaded) return t('est.na');
    if (an.estimate.level) return t('level.n', { n: an.estimate.level });
    return an.estimate.beyond ? t('est.beyond') : '—';
  }
  var CAT_KEY = { '詞彙': 'cat.vocab', '語法': 'cat.grammar', '句長': 'cat.length', '用語': 'cat.term', '字形': 'cat.glyph', '自然度': 'cat.natural', '內容': 'cat.content', '其他': 'cat.other' };
  var SRC_KEY = { '模型保留': 'src.model', '生詞表': 'src.gloss', '未處理': 'src.pending', '待處理': 'src.pending' };
  function zh(html) { return '<span lang="zh-Hant-TW">' + html + '</span>'; }

  function copyText(text, btn) {
    var done = function () {
      var c = btn.parentNode.querySelector('.copied');
      if (!c) { c = document.createElement('span'); c.className = 'copied'; btn.after(c); }
      c.textContent = t('copy.done');
      setTimeout(function () { c.textContent = ''; }, 2000);
    };
    var fallback = function () {
      var ta = document.createElement('textarea');
      ta.value = text; ta.setAttribute('readonly', ''); ta.style.position = 'fixed'; ta.style.opacity = '0';
      document.body.appendChild(ta); ta.select();
      try { document.execCommand('copy'); done(); } catch (e) { btn.textContent = t('copy.manual'); }
      ta.remove();
    };
    if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(text).then(done, fallback);
    else fallback();
  }

  // --------------------------------------------------------------------------- 對標滑桿（TOCFL 八級 → TBCL）

  // 華測會與國教院整體對應：準備一、二級 → TBCL 1；入門級 A1 → 2；基礎級 A2 → 3；進階級 B1 → 4；高階級 B2 → 5；流利級 C1 → 6；精通級 C2 → 7
  var STOPS = [
    { code: 'Novice 1', tbcl: 1, band: 'n' }, { code: 'Novice 2', tbcl: 1, band: 'n' },
    { code: 'A1', tbcl: 2, band: 'a' }, { code: 'A2', tbcl: 3, band: 'a' },
    { code: 'B1', tbcl: 4, band: 'b' }, { code: 'B2', tbcl: 5, band: 'b' },
    { code: 'C1', tbcl: 6, band: 'c' }, { code: 'C2', tbcl: 7, band: 'c' }
  ];
  function stopOf(n) { return n <= 1 ? 1 : Math.min(7, n); }
  function stopPos(i) { return 'calc(11px + ' + (i / 7) + ' * (100% - 22px))'; }

  function renderLevels() {
    var row = function (fn, cls) {
      return STOPS.map(function (st, i) {
        return '<span class="tk ' + cls + ' band-' + st.band + '" data-stop="' + i + '" style="left:' + stopPos(i) + '">' + esc(fn(st, i)) + '</span>';
      }).join('');
    };
    $('tk-code').innerHTML = row(function (st) { return st.code; }, 'code');
    $('tk-num').innerHTML = row(function (st) { return st.tbcl; }, 'num');
    setStop(S.stop === undefined ? stopOf(S.target) : S.stop, true);
  }

  /** 由 TBCL 等級設定滑桿（保留使用者在準備一、二級之間的選擇）。 */
  function setTarget(n, live) {
    setStop(S.stop !== undefined && STOPS[S.stop].tbcl === n ? S.stop : stopOf(n), live);
  }

  function setStop(i, live) {
    i = Math.max(0, Math.min(7, i | 0));
    var st = STOPS[i], n = st.tbcl, L = level(n), sl = $('level');
    S.stop = i; S.target = n;
    sl.value = i;
    sl.style.setProperty('--fill', stopPos(i));
    document.querySelectorAll('.ruler .tk').forEach(function (x) { x.classList.toggle('on', +x.dataset.stop === i); });
    var names = String(t('tocfl.names')).split(',');
    $('lvl-badge').textContent = t('badge', { code: st.code, name: names[i] || st.code, n: n });
    $('lvl-badge').className = 'badge band-' + st.band;
    if (L) {
      sl.setAttribute('aria-valuetext', t('level.aria', { n: n, band: bandName(L.band), tocfl: st.code, cefr: L.cefr }));
      $('lvl-meta').textContent = t(L.sentLenGuide ? 'level.meta' : 'level.meta.nolen',
        { words: fmt(L.cumWords), chars: fmt(L.cumChars), len: L.sentLenGuide, type: t('type.' + n) });
    }
    var label = t('btn.adjust', { n: n });
    $('btn-adjust').setAttribute('aria-label', label);
    $('btn-adjust').title = label;
    if (live) return;
    store('gr-target', String(n)); store('gr-stop', String(i));
    if (S.last && S.last.action === 'analyze' && $('text').value.trim()) doAnalyze();
  }

  // --------------------------------------------------------------------------- 表單

  function renderPurpose() {
    var checked = S.purpose;
    $('purpose').innerHTML = '<legend class="label">' + esc(t('purpose.legend')) + '</legend>' + Object.keys(S.purposes).map(function (k) {
      var p = S.purposes[k];
      return '<label class="radio" for="pp-' + k + '"><input type="radio" name="purpose" id="pp-' + k + '" value="' + k + '"'
        + (k === checked ? ' checked' : '') + '> ' + esc(t('purpose.opt', { label: t('purpose.' + k), pct: Math.round(p.threshold * 100) })) + '</label>';
    }).join('');
  }

  function renderLearners() {
    var cur = $('learner').value || 'adult_nonchar';
    $('learner').innerHTML = Object.keys(S.learners).map(function (k) {
      return '<option value="' + k + '"' + (k === cur ? ' selected' : '') + '>' + esc(t('learner.' + k)) + '</option>';
    }).join('');
  }

  function renderLangs() {
    $('ui-lang').innerHTML = I18N.langs.map(function (l) {
      return '<option value="' + l.code + '" lang="' + esc(l.bcp) + '">' + esc(l.name) + '</option>';
    }).join('');
  }

  function updateCount() {
    var n = hanCount($('text').value);
    var max = S.status && S.status.limits ? S.status.limits.maxChars : 3000;
    $('count').textContent = t('count', { n: fmt(n), max: fmt(max) });
    $('count').classList.toggle('over', n > max);
  }

  function collect() {
    var pp = document.querySelector('input[name="purpose"]:checked');
    return {
      text: $('text').value, target: S.target, mode: $('mode').value,
      purpose: pp ? pp.value : 'extensive', learner: $('learner').value,
      protectedWords: $('protected').value, known: $('known').value, glossary: $('glossary').value,
      notes: $('notes').value, stripSpeakers: $('strip').checked
    };
  }

  function renderStatus(st) {
    var chips = [];
    if (window.GR_PREVIEW) chips.push('<span class="chip warn"><span class="dot"></span>' + esc(t('status.preview')) + '</span>');
    chips.push(st.lexicon.loaded
      ? '<span class="chip ok" title="' + esc(st.lexicon.label) + '"><span class="dot"></span>' + esc(t('status.lex', { n: fmt(st.lexicon.entries) })) + '</span>'
      : '<span class="chip warn"><span class="dot"></span>' + esc(t('status.nolex')) + '</span>');
    chips.push(st.llm.configured
      ? '<span class="chip ok"><span class="dot"></span>' + esc(t('status.ai', { m: modelName(st.llm.model) })) + '</span>'
      : '<span class="chip warn" title="' + esc(st.llm.hint) + '"><span class="dot"></span>' + esc(t('status.noai')) + '</span>');
    if (st.llm.configured) chips.push('<span class="chip num"><span class="dot"></span>' + esc(t('status.quota', { u: st.quota.used, l: st.quota.limit })) + '</span>');
    $('status').innerHTML = chips.join('');
    $('ver').textContent = st.version;
    $('adjust-hint').textContent = (st.llm.configured ? t('hint.adjust', { r: st.limits.maxRounds }) : t('hint.noai')) + ' ' + t('composer.hint');
  }

  // --------------------------------------------------------------------------- 忙碌與錯誤

  function setBusy(on, text, timed) {
    $('busy').hidden = !on;
    $('result-pane').setAttribute('aria-busy', on);
    $('btn-analyze').disabled = on;
    $('btn-adjust').disabled = on;
    if (on) $('result-pane').hidden = false;
    clearInterval(S.timer);
    if (on) {
      $('busy-text').textContent = text;
      $('busy-time').textContent = '';
      if (timed) {
        var t0 = Date.now();
        S.timer = setInterval(function () { $('busy-time').textContent = t('busy.elapsed', { s: Math.round((Date.now() - t0) / 1000) }); }, 1000);
      }
    }
  }

  function showError(msg) {
    $('error').hidden = !msg;
    $('error').textContent = msg || '';
  }

  // --------------------------------------------------------------------------- 執行

  function doAnalyze() {
    var req = collect();
    if (!req.text.trim()) { showError(t('err.noText')); return; }
    showError('');
    setBusy(true, t('busy.analyze'));
    call('uiAnalyze', req).then(handle, function (e) { setBusy(false); showError(e.message); });
  }

  function send() {
    if (S.status && S.status.llm.configured) doAdjust(); else doAnalyze();
  }

  function doAdjust() {
    var req = collect();
    if (!req.text.trim()) { showError(t('err.noText')); return; }
    var max = S.status.limits.maxChars;
    if (hanCount(req.text) > max) { showError(t('err.tooLong', { max: fmt(max) })); return; }
    showError('');
    setBusy(true, t('busy.adjust', { n: req.target }), true);
    call('uiAdjust', req).then(handle, function (e) { setBusy(false); showError(e.message); });
  }

  function handle(res) {
    setBusy(false);
    if (!res || !res.ok) { showError(res && res.error || t('err.unknown')); return; }
    S.last = res;
    S.view = res.action === 'adjust' && res.rounds > 0 ? 'after' : 'before';
    $('result').hidden = false;
    renderResult(false);
    if (res.action === 'adjust') {
      call('uiBootstrap').then(function (b) { if (b && b.ok) { S.status = b.status; renderStatus(b.status); } });
    }
  }

  // --------------------------------------------------------------------------- 結果

  function renderResult(keepTab) {
    var res = S.last;
    var adjusted = res.action === 'adjust' && res.rounds > 0;
    renderVerdict(res, adjusted);
    renderReport();
    $('t-revised').disabled = res.action !== 'adjust';
    $('t-changes').disabled = !adjusted;
    $('n-changes').textContent = adjusted ? res.changes.length : '';
    var gl = glossaryRows(res);
    $('n-gloss').textContent = gl.length || '';
    if (res.action === 'adjust') renderRevised(res);
    renderChanges(res);
    renderGlossary(gl, res);
    renderMd(res);
    var tab = keepTab && !$(S.currentTab).disabled ? S.currentTab : (res.action === 'adjust' ? 't-revised' : 't-report');
    selectTab(tab);
  }

  function renderVerdict(res, adjusted) {
    var b = res.before, a = res.after || b, L = level(res.target);
    var target = t('verdict.target', { n: res.target, tocfl: tocflName(L) });
    var html = '';
    if (res.action === 'adjust') {
      var pill = !res.verified ? ['na', 'verdict.unverified'] : res.passed ? ['ok', 'verdict.passed'] : ['hard', 'verdict.notpassed'];
      html += '<div class="verdict-line"><span class="pill ' + pill[0] + '">' + esc(t(pill[1])) + '</span>'
        + '<span class="verdict-text">' + esc(t('verdict.level')) + ' <b>' + esc(estText(b)) + '</b> → <b>' + esc(estText(a)) + '</b>｜' + esc(target) + '</span></div>'
        + '<p class="fine">' + (adjusted
          ? esc(t('verdict.rounds', { dir: t('dir.' + res.direction), r: res.rounds })) + (res.llm.model ? '・' + esc(modelName(res.llm.model)) : '')
          : zh(esc(res.summary))) + '</p>';
    } else {
      var st = b.target ? b.target.status : '無法判定';
      var key = { '偏難': ['hard', 'st.hard'], '偏易': ['easy', 'st.easy'], '合級': ['ok', 'st.ok'] }[st] || ['na', 'st.na'];
      html += '<div class="verdict-line"><span class="pill ' + key[0] + '">' + esc(t(key[1])) + '</span>'
        + '<span class="verdict-text">' + esc(t('verdict.est')) + ' <b>' + esc(estText(b)) + '</b>｜' + esc(target) + '</span></div>'
        + '<p class="fine">' + esc(t('verdict.suggest', { dir: t('dir.' + res.direction) }))
        + (S.status && S.status.llm.configured ? esc(t('verdict.suggestBtn', { btn: t('btn.adjust', { n: res.target }) })) : '') + '</p>';
    }
    html += '<p class="statement" lang="zh-Hant-TW">' + esc(res.statement) + '</p>';
    $('verdict').innerHTML = html;
  }

  function kpis(an, target) {
    var L = level(target);
    if (!an.meta.lexiconLoaded) {
      return '<div class="kpis"><div class="kpi"><span class="k">' + esc(t('kpi.est')) + '</span><span class="v">—</span><span class="d">' + esc(t('kpi.nolex')) + '</span></div>'
        + '<div class="kpi"><span class="k">' + esc(t('kpi.han')) + '</span><span class="v num">' + fmt(an.stats.hanChars) + '</span><span class="d">' + esc(t('kpi.tokens', { n: fmt(an.stats.tokens) })) + '</span></div>'
        + sentKpi(an, L) + '<div class="kpi"><span class="k">' + esc(t('kpi.simp')) + '</span><span class="v num">' + (an.norms ? an.norms.simplified.length : '—') + '</span><span class="d">' + esc(t('kpi.terms', { n: an.norms ? an.norms.terms.length : '—' })) + '</span></div></div>';
    }
    var tg = an.target, e = an.estimate;
    return '<div class="kpis">'
      + '<div class="kpi ' + (e.level === target ? 'good' : 'bad') + '"><span class="k">' + esc(t('kpi.est')) + '</span><span class="v">' + (e.level ? esc(t('level.n', { n: e.level })) : (e.beyond ? '7+' : '—')) + '</span>'
      + '<span class="d">' + esc(t('kpi.est.d', { t: e.threshold })) + '</span></div>'
      + '<div class="kpi ' + (tg.pass ? 'good' : 'bad') + '"><span class="k">' + esc(t('kpi.cov')) + '</span><span class="v num">' + tg.effectivePct + '<small>%</small></span>'
      + '<span class="d num">' + esc(t('kpi.cov.d', { t: tg.threshold, w: tg.withinPct })) + '</span></div>'
      + '<div class="kpi ' + (tg.aboveUnglossedTypes ? 'bad' : 'good') + '"><span class="k">' + esc(t('kpi.above')) + '</span><span class="v num">' + tg.aboveUnglossedTypes + '</span>'
      + '<span class="d num">' + esc(t('kpi.above.d', { n: tg.aboveUnglossedTokens, p: tg.newWordsPer100 })) + '</span></div>'
      + sentKpi(an, L) + '</div>';
  }
  function sentKpi(an, L) {
    var g = L && L.sentLenGuide, over = g && an.sentences.mean > g;
    return '<div class="kpi ' + (g ? (over ? 'bad' : 'good') : '') + '"><span class="k">' + esc(t('kpi.sent')) + '</span><span class="v num">' + an.sentences.mean + '</span>'
      + '<span class="d num">' + esc(g ? t('kpi.sent.d', { g: g, m: an.sentences.max }) : t('kpi.sent.d2', { m: an.sentences.max })) + '</span></div>';
  }

  // 覆蓋率曲線（SVG，單一數列＋門檻線＋目標線）
  function curveSvg(an, target) {
    var W = 320, H = 176, l = 34, r = 14, tp = 18, b = 26;
    var pts = an.estimate.curve, thr = an.estimate.threshold;
    var lo = Math.min.apply(null, pts.map(function (p) { return p.cov; }).concat([thr - 4]));
    var ymin = Math.max(0, Math.floor((lo - 2) / 10) * 10), ymax = 100;
    var step = ymax - ymin > 40 ? 20 : ymax - ymin > 20 ? 10 : 5;
    var x = function (lv) { return l + (lv - 1) * (W - l - r) / 6; };
    var y = function (v) { return tp + (ymax - v) * (H - tp - b) / (ymax - ymin); };
    var g = '';
    for (var v = ymin; v <= ymax; v += step) {
      g += '<line class="gridline" x1="' + l + '" x2="' + (W - r) + '" y1="' + y(v) + '" y2="' + y(v) + '"></line>'
         + '<text x="' + (l - 6) + '" y="' + (y(v) + 4) + '" text-anchor="end">' + v + '%</text>';
    }
    for (var lv = 1; lv <= 7; lv++) g += '<text x="' + x(lv) + '" y="' + (H - 8) + '" text-anchor="middle">' + lv + '</text>';
    var d = pts.map(function (p, i) { return (i ? 'L' : 'M') + x(p.level).toFixed(1) + ' ' + y(p.cov).toFixed(1); }).join(' ');
    var area = d + ' L' + x(7) + ' ' + y(ymin) + ' L' + x(1) + ' ' + y(ymin) + ' Z';
    var est = an.estimate.level;
    var dots = pts.map(function (p) {
      return '<circle class="pt' + (p.level === est ? ' est' : '') + '" cx="' + x(p.level) + '" cy="' + y(p.cov) + '" r="' + (p.level === est ? 5 : 3.5) + '"></circle>';
    }).join('');
    var lab = est ? pts[est - 1] : pts[6];
    var labRight = lab.level < 6;
    var labX = x(lab.level) + (labRight ? 8 : -8);
    var hits = pts.map(function (p) {
      var w = (W - l - r) / 6;
      return '<rect class="hit" data-lv="' + p.level + '" data-cov="' + p.cov + '" x="' + (x(p.level) - w / 2) + '" y="' + tp + '" width="' + w + '" height="' + (H - tp - b) + '"></rect>';
    }).join('');
    return '<div class="curve" id="curve"><svg viewBox="0 0 ' + W + ' ' + H + '" role="img" aria-label="' + esc(t('chart.curve.aria')) + '">'
      + '<g class="axis">' + g + '</g>'
      + '<line class="tgt" x1="' + x(target) + '" x2="' + x(target) + '" y1="' + tp + '" y2="' + (H - b) + '"></line>'
      + '<text class="tgt-lbl" x="' + x(target) + '" y="' + (tp - 6) + '" text-anchor="middle">' + esc(t('chart.tgt', { n: target })) + '</text>'
      + '<path class="area" d="' + area + '"></path><path class="line" d="' + d + '"></path>'
      + '<line class="thr" x1="' + l + '" x2="' + (W - r) + '" y1="' + y(thr) + '" y2="' + y(thr) + '"></line>'
      + '<text class="thr-lbl" x="' + (l + 4) + '" y="' + (y(thr) - 5) + '">' + esc(t('chart.thr', { t: thr })) + '</text>'
      + '<line class="xh" id="xh" x1="0" x2="0" y1="' + tp + '" y2="' + (H - b) + '" visibility="hidden"></line>'
      + dots
      + '<text class="tgt-lbl" x="' + labX + '" y="' + (y(lab.cov) + 16) + '" text-anchor="' + (labRight ? 'start' : 'end') + '">' + lab.cov + '%</text>'
      + hits + '</svg><div class="tip" id="curve-tip" hidden></div></div>';
  }

  function bindCurve() {
    var box = $('curve'); if (!box) return;
    var tip = $('curve-tip'), xh = $('xh'), svg = box.querySelector('svg');
    box.querySelectorAll('.hit').forEach(function (h) {
      var show = function () {
        var rect = svg.getBoundingClientRect(), vb = svg.viewBox.baseVal;
        var cx = +h.getAttribute('x') + +h.getAttribute('width') / 2;
        xh.setAttribute('x1', cx); xh.setAttribute('x2', cx); xh.setAttribute('visibility', 'visible');
        tip.textContent = t('chart.tip', { n: h.dataset.lv, c: h.dataset.cov });
        tip.style.left = (cx / vb.width * rect.width) + 'px';
        tip.style.top = '18px';
        tip.hidden = false;
      };
      h.addEventListener('mouseenter', show);
      h.addEventListener('touchstart', show, { passive: true });
      h.addEventListener('mouseleave', function () { tip.hidden = true; xh.setAttribute('visibility', 'hidden'); });
    });
  }

  function distRows(an, target) {
    var rows = an.levelDist.map(function (d) {
      return { name: t('level.n', { n: d.level }), tag: d.level > target ? t('chart.above') : '', pct: d.pct, n: d.tokens,
               cls: d.level > target ? 'above' : '', title: t('chart.lv.title', { n: d.level, band: bandName(d.band), tok: d.tokens, types: d.types }) };
    });
    var s = an.support, sup = s.glossary + s.known + s.proper + s.numerals, tok = an.stats.tokens || 1;
    var oovN = an.oov.reduce(function (m, o) { return m + o.n; }, 0);
    rows.push({ name: t('chart.support'), pct: Math.round(1000 * sup / tok) / 10, n: sup, cls: 'muted', sep: true,
                title: t('chart.support.title', { p: s.proper, g: s.glossary, k: s.known, num: s.numerals }) });
    rows.push({ name: t('chart.oov'), pct: Math.round(1000 * oovN / tok) / 10, n: oovN, cls: 'muted', title: t('chart.oov.title') });
    var max = Math.max.apply(null, rows.map(function (r) { return r.pct; }).concat([1]));
    return '<div class="dist" role="table" aria-label="' + esc(t('chart.dist')) + '">' + rows.map(function (r) {
      return '<div class="drow' + (r.sep ? ' sep' : '') + '" role="row" title="' + esc(r.title) + '">'
        + '<span class="name" role="cell">' + esc(r.name) + (r.tag ? '<span class="tag">' + esc(r.tag) + '</span>' : '') + '</span>'
        + '<span class="track" role="cell"><span class="bar ' + r.cls + (r.n ? '' : ' zero') + '" style="width:' + (r.n ? Math.max(1.5, 100 * r.pct / max) : 0) + '%;display:block"></span></span>'
        + '<span class="val" role="cell">' + r.pct + '%｜' + r.n + '</span></div>';
    }).join('') + '</div>';
  }

  /** 標記文本。用 ToneOZ 字型時改用含多音字選擇器（IVS）的字串，讓多音字顯示 TBCL 參考讀音。 */
  function spansHtml(an, target) {
    if (!an.spans) return '';
    var simp = {}, ivs = S.font !== 'std';
    (an.norms ? an.norms.simplified : []).forEach(function (x) { simp[x.c] = true; });
    var markSimp = function (s) {
      return Array.from(s).map(function (c) { return simp[c] ? '<span class="simp" title="' + esc(t('tip.simp')) + '">' + esc(c) + '</span>' : esc(c); }).join('');
    };
    return an.spans.map(function (s) {
      var txt = markSimp(ivs && s.iv ? s.iv : s.t);
      switch (s.k) {
        case 'w':
          if (s.l > target) return '<span class="' + (s.gl ? 'gl' : 'ab') + '" title="' + esc(t('tip.word', { w: s.t, n: s.l }) + (s.gl ? t('tip.glossed') : '')) + '">' + txt + '<sup>' + s.l + '</sup></span>';
          if (S.showTarget && s.l === target) return '<span class="tl" title="' + esc(t('tip.target', { n: s.l })) + '">' + txt + '</span>';
          return txt;
        case 'o': return '<span class="oov" title="' + esc(t('tip.oov')) + '">' + txt + '</span>';
        case 'p': return '<span class="pn" title="' + esc(t('tip.proper')) + '">' + txt + '</span>';
        case 'g': return '<span class="pn" title="' + esc(t('tip.gloss')) + '">' + txt + '</span>';
        case 'k': return '<span class="pn" title="' + esc(t('tip.known')) + '">' + txt + '</span>';
        case 's': return '<span class="sp" title="' + esc(t('tip.speaker')) + '">' + txt + '</span>';
        default: return txt;
      }
    }).join('');
  }
  function ivsText(an) { return (an.spans || []).map(function (s) { return s.iv || s.t; }).join(''); }

  function legendHtml() {
    return '<div class="legend"><span><span class="sw ab" lang="zh-Hant-TW">擁擠<sup>5</sup></span>' + esc(t('legend.above')) + '</span>'

        + esc(t('th.word')) + '</th><th>' + esc(t('th.lv')) + '</th><th class="n">' + esc(t('th.n')) + '</th><th>' + esc(t('th.ctx')) + '</th><th>' + esc(t('th.state')) + '</th></tr></thead><tbody>'
        + an.target.above.map(function (a) {
          return '<tr><td class="w" lang="zh-Hant-TW">' + esc(a.w) + '</td><td><span class="lv above">' + a.lv + '</span></td><td class="n">' + a.n + '</td><td class="ctx" lang="zh-Hant-TW">' + esc(a.ctx) + '</td><td>'
            + (a.glossed ? '<span class="cat">' + esc(t('st.glossed')) + '</span>' : '<span class="flag">' + esc(t('st.pending')) + '</span>') + '</td></tr>';
        }).join('') + '</tbody></table></div></div>';

    if (an.norms && (an.norms.terms.length || an.norms.simplified.length || an.norms.variants.length)) {
      h += '<div class="sec"><h3 class="sec-h">' + esc(t('iss.norms')) + '<span class="aside">' + esc(t('iss.norms.aside')) + '</span></h3>';
      if (an.norms.simplified.length) h += '<p class="fine">' + esc(t('iss.simp', { p: an.norms.simplifiedPct })) + '</p><div class="chips" lang="zh-Hant-TW">' + an.norms.simplified.map(function (x) { return '<span>' + esc(x.c) + '<em>×' + x.n + '</em></span>'; }).join('') + '</div>';
      if (an.norms.variants.length) h += '<p class="fine">' + esc(t('iss.variants')) + '</p><div class="chips" lang="zh-Hant-TW">' + an.norms.variants.map(function (v) { return '<span>' + esc(v.c) + '→' + esc(v.to) + '<em>×' + v.n + '</em></span>'; }).join('') + '</div>';
      if (an.norms.terms.length) {
        h += '<div class="tablewrap"><table><thead><tr><th>' + esc(t('th.term')) + '</th><th>' + esc(t('th.tw')) + '</th><th class="n">' + esc(t('th.n')) + '</th><th>' + esc(t('th.ctx')) + '</th><th>' + esc(t('th.note')) + '</th></tr></thead><tbody>'
          + an.norms.terms.map(function (tm) {
            return '<tr><td class="w" lang="zh-Hant-TW">' + esc(tm.form) + '</td><td class="w" lang="zh-Hant-TW">' + esc(tm.tw) + '</td><td class="n">' + tm.n + '</td><td class="ctx" lang="zh-Hant-TW">' + esc(tm.ctx) + '</td><td lang="zh-Hant-TW">' + esc(tm.note) + '</td></tr>';
          }).join('') + '</tbody></table></div>';
      }
      h += '</div>';
    }
    if (an.oov.length) {
      h += '<div class="sec"><h3 class="sec-h">' + esc(t('iss.oov')) + '<span class="aside">' + esc(t('iss.oov.aside')) + '</span></h3><div class="chips" lang="zh-Hant-TW">'
        + an.oov.map(function (o) { return '<span title="' + esc(o.ctx) + '">' + esc(o.w) + '<em>×' + o.n + '</em></span>'; }).join('') + '</div></div>';
    }
    var longList = an.sentences.overLong && an.sentences.overLong.length ? an.sentences.overLong : [];
    if (longList.length) {
      h += '<div class="sec"><h3 class="sec-h">' + esc(t('iss.long')) + '<span class="aside">' + esc(t('iss.long.aside')) + '</span></h3><ul class="notes">'
        + longList.slice(0, 6).map(function (x) { return '<li><span class="num">' + esc(t('iss.len', { n: x.len })) + '</span>　' + zh(esc(x.text)) + '</li>'; }).join('') + '</ul></div>';
    }
    return h;
  }

  function renderReport() {
    var res = S.last, adjusted = res.action === 'adjust' && res.rounds > 0;

  }

        + '</tbody></table></div></div>';

      + rows.map(function (g) {
        return '<tr><td class="w" lang="zh-Hant-TW">' + esc(g.w) + '</td><td>' + (g.lv ? '<span class="lv above">' + g.lv + '</span>' : '<span class="lv none">' + esc(t('gl.notIn')) + '</span>') + '</td><td class="n">' + g.n + '</td>'
          + '<td>' + esc(g.py) + '</td><td lang="zh-Hant-TW">' + esc(g.zy) + '</td><td>' + esc(g.pos) + '</td><td lang="en">' + esc(g.en) + '</td><td>' + esc(src(g)) + (g.reason ? '：' + zh(esc(g.reason)) : '') + '</td></tr>';
      }).join('') + '</tbody></table></div>';
    $('p-gloss').innerHTML = h;
    $('copy-gl').addEventListener('click', function () {
      // 複製出去的表格是教材內容，欄名維持中文
      var tsv = ['詞\tTBCL級\t次數\t漢語拼音\t注音\t詞類\t英譯\t來源']
        .concat(rows.map(function (g) { return [g.w, g.lv || '', g.n, g.py, g.zy, g.pos, g.en, g.source + (g.reason ? '：' + g.reason : '')].join('\t'); }));
      copyText(tsv.join('\n'), $('copy-gl'));
    });
    $('add-gl').addEventListener('click', function () {
      var have = $('glossary').value.trim();
      var add = rows.map(function (g) { return g.w; }).filter(function (w) { return have.split(/[\n、,，\s]+/).indexOf(w) < 0; });
      $('glossary').value = (have ? have + '\n' : '') + add.join('\n');
      $('more').open = true;
      $('glossary').focus();
    });
  }

  // 極簡 Markdown 轉 HTML（標題、段落、清單、表格、引言、粗體）
  function md2html(md) {
    var lines = String(md || '').split('\n'), out = [], i = 0;
    var inline = function (s) { return esc(s).replace(/\*\*(.+?)\*\*/g, '<b>$1</b>'); };
    while (i < lines.length) {
      var ln = lines[i];
      if (/^#{1,3} /.test(ln)) { var lv = ln.match(/^#+/)[0].length; out.push('<h' + lv + '>' + inline(ln.replace(/^#+ /, '')) + '</h' + lv + '>'); i++; continue; }
      if (/^\|/.test(ln)) {
        var rows = [];
        while (i < lines.length && /^\|/.test(lines[i])) { rows.push(lines[i]); i++; }
        var cells = function (r) { return r.replace(/^\||\|$/g, '').split('|').map(function (c) { return c.trim(); }); };
        var head = cells(rows[0]), body = rows.slice(2);
        out.push('<div class="tablewrap"><table><thead><tr>' + head.map(function (c) { return '<th>' + inline(c) + '</th>'; }).join('') + '</tr></thead><tbody>'
          + body.map(function (r) { return '<tr>' + cells(r).map(function (c) { return '<td>' + inline(c) + '</td>'; }).join('') + '</tr>'; }).join('') + '</tbody></table></div>');
        continue;
      }
      if (/^- /.test(ln)) {
        var items = [];
        while (i < lines.length && /^- /.test(lines[i])) { items.push('<li>' + inline(lines[i].slice(2)) + '</li>'); i++; }
        out.push('<ul>' + items.join('') + '</ul>'); continue;
      }
      if (/^> /.test(ln)) { out.push('<blockquote>' + inline(ln.slice(2)) + '</blockquote>'); i++; continue; }
      if (!ln.trim()) { i++; continue; }
      var para = [];
      while (i < lines.length && lines[i].trim() && !/^(#|\||- |> )/.test(lines[i])) { para.push(inline(lines[i])); i++; }
      out.push('<p>' + para.join('<br>') + '</p>');
    }
    return out.join('');
  }

  function renderMd(res) {
    $('p-md').innerHTML = '<div class="toolbar"><button type="button" class="btn small primary" id="copy-md">' + esc(t('md.copy')) + '</button>'
      + '<span class="fine">' + esc(t('md.note')) + '</span></div>'
      + '<div class="md" lang="zh-Hant-TW">' + md2html(res.report) + '</div>';
    $('copy-md').addEventListener('click', function () { copyText(res.report, $('copy-md')); });
  }

  // --------------------------------------------------------------------------- 分頁

  var TABS = ['t-report', 't-revised', 't-changes', 't-gloss', 't-md'];
  function selectTab(id, focus) {
    S.currentTab = id;
    TABS.forEach(function (x) {
      var on = x === id, btn = $(x);
      btn.setAttribute('aria-selected', on);
      btn.tabIndex = on ? 0 : -1;
      $(btn.getAttribute('aria-controls')).hidden = !on;
      if (on && focus) btn.focus();
    });
  }

  // --------------------------------------------------------------------------- 啟動

  function bind() {
    $('level').addEventListener('input', function () { setStop(+$('level').value, true); });
    $('level').addEventListener('change', function () { setStop(+$('level').value); });
    document.querySelector('.ruler').addEventListener('click', function (e) {
      var x = e.target.closest('.tk');
      if (x) { setStop(+x.dataset.stop); $('level').focus(); }
    });
    $('text').addEventListener('keydown', function (e) {
      if (e.key === 'Enter' && (e.ctrlKey || e.metaKey)) { e.preventDefault(); send(); }
    });
    $('ui-lang').addEventListener('change', function () { store('gr-lang', $('ui-lang').value); setLang($('ui-lang').value, true); });
    $('read-font').addEventListener('change', function () { setFont($('read-font').value); });
    $('read-size').addEventListener('click', function (e) { var b = e.target.closest('button'); if (b) setSize(b.dataset.size); });
    $('purpose').addEventListener('change', function () {
      var pp = document.querySelector('input[name="purpose"]:checked');
      S.purpose = pp ? pp.value : 'extensive';
      if (S.last && S.last.action === 'analyze') doAnalyze();
    });
    $('text').addEventListener('input', updateCount);
    $('btn-sample').addEventListener('click', function () {
      $('text').value = SAMPLE; $('protected').value = SAMPLE_PROTECTED; updateCount(); doAnalyze();
    });
    $('btn-clear').addEventListener('click', function () {
      $('text').value = ''; $('protected').value = ''; updateCount(); $('text').focus();
    });
    $('btn-analyze').addEventListener('click', doAnalyze);
    $('btn-adjust').addEventListener('click', send);
    TABS.forEach(function (x, i) {
      $(x).addEventListener('click', function () { if (!$(x).disabled) selectTab(x); });
      $(x).addEventListener('keydown', function (e) {
        var d = { ArrowRight: 1, ArrowLeft: -1 }[e.key];
        if (!d) return;
        var j = i;
        do { j = (j + d + TABS.length) % TABS.length; } while ($(TABS[j]).disabled && j !== i);
        selectTab(TABS[j], true);
      });
    });
  }

  function start() {
    var prefs = window.GR_URL_PREFS || {};
    renderLangs();
    bind();
    setLang(pickLang(''), false);
    setSize(prefs.size || store('gr-size') || 'm');
    if (window.GR_PREVIEW) {
      $('preview-note').hidden = false;
      $('preview-note').textContent = window.GR_PREVIEW.note;
    }
    call('uiBootstrap').then(function (b) {
      if (!b || !b.ok) { showError(b && b.error || t('err.init')); return; }
      S.levels = b.levels; S.purposes = b.purposes; S.learners = b.learners; S.status = b.status;
      if (b.ui) {
        OVR = b.ui.i18n || {};
        S.fonts = b.ui.fonts || S.fonts;
        if (!(prefs.lang || store('gr-lang')) && b.ui.defaultLang) LANG = pickLang(b.ui.defaultLang);
      }
      var saved = prefs.level || parseInt(store('gr-target') || '', 10);
      S.target = saved >= 1 && saved <= 7 ? saved : 3;
      var savedStop = parseInt(store('gr-stop') || '', 10);
      if (!prefs.level && savedStop >= 0 && savedStop <= 7 && STOPS[savedStop].tbcl === S.target) S.stop = savedStop;
      setLang(LANG, false);
      renderLevels(); renderPurpose(); renderLearners(); renderStatus(b.status);
      setTarget(S.target, true);
      setFont(prefs.font || store('gr-font') || 'std');
      // 輸入欄一律從空白開始，讓學習者自己輸入；不保留上一位使用者的文本
      $('text').value = ''; $('protected').value = '';
      updateCount();
    }, function (e) { showError(e.message); });
  }

  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', start); else start();
})();
</script>
